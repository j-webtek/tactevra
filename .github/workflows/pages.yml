name: Project video

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "assets/media/**"
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify published media identities
        run: python scripts/ci/check_public_records.py --media-only
      - name: Assemble player
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/media
          cp site/index.html _site/index.html
          cp assets/media/tactevra-overview.mp4 _site/media/
          cp assets/media/tactevra-overview-poster.jpg _site/media/
          cp assets/media/tactevra-overview.en.vtt _site/media/
          cp assets/media/tactevra-overview.chapters.vtt _site/media/
          cp assets/media/tactevra-social-preview.jpg _site/media/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Archive player
        shell: bash
        run: |
          tar \
            --dereference --hard-dereference \
            --directory _site \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .
      - name: Upload Pages artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Smoke-check the deployed public surface
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          page="${PAGE_URL%/}/"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location "$page" --output "$RUNNER_TEMP/tactevra-page.html"; then
              break
            fi
            if [[ "$attempt" == "6" ]]; then
              echo "Pages did not become readable after ${attempt} bounded attempts" >&2
              exit 1
            fi
            sleep 10
          done
          grep -q '<title>.*Tactevra' "$RUNNER_TEMP/tactevra-page.html"
          curl --fail --silent --show-error --location --head \
            "${page}media/tactevra-overview-poster.jpg" >/dev/null
          {
            echo '### Pages deployment smoke check'
            echo
            echo "- Public page: ${page}"
            echo '- Tactevra title: present'
            echo '- Overview poster: reachable'
          } >> "$GITHUB_STEP_SUMMARY"
