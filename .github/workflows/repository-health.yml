name: Repository health

on:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: repository-health
  cancel-in-progress: true

jobs:
  public-drift:
    name: Public repository drift
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Compare public GitHub state with policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/ci/check_repository_health.py \
            --scope public \
            --repository "$GITHUB_REPOSITORY" \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Compare release ledger with tracker, milestone, and blocker issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/ci/check_release_readiness_sync.py
          --online
          --repository "$GITHUB_REPOSITORY"
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Build bounded operations report
        if: always()
        run: >-
          python scripts/ci/build_repository_operations_report.py
          --output-dir "$RUNNER_TEMP/repository-operations"
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Retain operations report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-operations-${{ github.run_id }}
          path: ${{ runner.temp }}/repository-operations/
          if-no-files-found: error
          retention-days: 30
