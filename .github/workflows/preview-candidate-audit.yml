name: Preview candidate audit

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full 40-character commit SHA to audit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preview-candidate-audit-${{ inputs.expected_sha }}
  cancel-in-progress: false

jobs:
  candidate-audit:
    name: Source preview candidate / audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify immutable candidate identity
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess

          expected = os.environ['EXPECTED_SHA'].lower()
          if not re.fullmatch(r'[0-9a-f]{40}', expected):
              raise SystemExit('expected_sha must be one full 40-character hexadecimal commit SHA')
          dispatched = os.environ['DISPATCH_SHA'].lower()
          if not re.fullmatch(r'[0-9a-f]{40}', dispatched):
              raise SystemExit('GitHub did not provide a full dispatch commit SHA')
          actual = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip().lower()
          if actual != dispatched or actual != expected:
              raise SystemExit(
                  f'checked out {actual}, dispatch selected {dispatched}, expected {expected}'
              )
          print(f'Candidate identity verified: {actual}')
          PY
      - name: Run read-only candidate audits
        id: audits
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set +e
          python scripts/ci/check_release_integrity.py --mode candidate
          integrity_status=$?
          python scripts/audit_github_snapshot.py
          snapshot_status=$?
          python scripts/ci/check_docs.py
          docs_status=$?
          python scripts/ci/check_evidence_ledger_append_only.py
          ledger_status=$?
          python scripts/ci/check_source_archive_footprint.py
          footprint_status=$?
          set -e

          {
            echo "integrity_status=${integrity_status}"
            echo "snapshot_status=${snapshot_status}"
            echo "docs_status=${docs_status}"
            echo "ledger_status=${ledger_status}"
            echo "footprint_status=${footprint_status}"
          } >> "$GITHUB_OUTPUT"

      - name: Build deterministic review packet
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          INTEGRITY_STATUS: ${{ steps.audits.outputs.integrity_status }}
          SNAPSHOT_STATUS: ${{ steps.audits.outputs.snapshot_status }}
          DOCS_STATUS: ${{ steps.audits.outputs.docs_status }}
          LEDGER_STATUS: ${{ steps.audits.outputs.ledger_status }}
          FOOTPRINT_STATUS: ${{ steps.audits.outputs.footprint_status }}
        shell: bash
        run: |
          python scripts/ci/build_release_review_packet.py \
            --expected-sha "$EXPECTED_SHA" \
            --output release-review-packet \
            --check "release_integrity=${INTEGRITY_STATUS}" \
            --check "snapshot_audit=${SNAPSHOT_STATUS}" \
            --check "maintained_docs=${DOCS_STATUS}" \
            --check "evidence_ledger_append_only=${LEDGER_STATUS}" \
            --check "source_footprint=${FOOTPRINT_STATUS}" \
            | tee release-review-summary.md
          cat release-review-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload non-publishing review packet
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-preview-review-${{ inputs.expected_sha }}
          path: release-review-packet/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce candidate gate
        env:
          INTEGRITY_STATUS: ${{ steps.audits.outputs.integrity_status }}
          SNAPSHOT_STATUS: ${{ steps.audits.outputs.snapshot_status }}
          DOCS_STATUS: ${{ steps.audits.outputs.docs_status }}
          LEDGER_STATUS: ${{ steps.audits.outputs.ledger_status }}
          FOOTPRINT_STATUS: ${{ steps.audits.outputs.footprint_status }}
        shell: bash
        run: |
          if (( INTEGRITY_STATUS != 0 || SNAPSHOT_STATUS != 0 || DOCS_STATUS != 0 || LEDGER_STATUS != 0 || FOOTPRINT_STATUS != 0 )); then
            echo 'Candidate remains blocked; inspect the uploaded review packet.'
            exit 1
          fi
